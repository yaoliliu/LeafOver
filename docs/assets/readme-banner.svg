<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">LeafOver — Work with your agent. See the paper live.</title>
  <desc id="desc">A hollow inverted apple logo beside a coding agent terminal, LaTeX source, and live paper preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a13"/>
      <stop offset=".54" stop-color="#10251a"/>
      <stop offset="1" stop-color="#133421"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#20985e" stop-opacity=".4"/>
      <stop offset="1" stop-color="#20985e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243c2d"/>
      <stop offset="1" stop-color="#14291e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#e9eee7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8bb49a" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030c06" flood-opacity=".56"/>
    </filter>
    <clipPath id="rounded"><rect width="1440" height="520" rx="28"/></clipPath>
  </defs>
