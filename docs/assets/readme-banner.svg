    <text x="76" y="265" fill="#f1f6ef" font-family="Inter,Arial,sans-serif" font-size="57" font-weight="760" letter-spacing="-3.4">Work with your agent.</text>
    <text x="76" y="333" fill="#78d8a3" font-family="Inter,Arial,sans-serif" font-size="60" font-weight="760" letter-spacing="-3.4">See the paper live.</text>
    <text x="79" y="377" fill="#b4c6b6" font-family="Inter,Arial,sans-serif" font-size="20">Terminal, LaTeX source, and live PDF in one place.</text>
