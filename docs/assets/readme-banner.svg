      <circle cx="21" cy="20" r="4" fill="#65c78d"/>
      <text x="35" y="25" fill="#b4d8be" font-family="monospace" font-size="13">agent · intro.tex</text>
      <text x="20" y="56" fill="#80dca4" font-family="monospace" font-size="15" font-weight="700">&gt; PDF updated · 18 pages</text>
