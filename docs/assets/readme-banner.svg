        <text x="22" y="124" fill="#6e987a">02</text><text x="60" y="124" fill="#c8d8c5">When diffusion models</text>
        <text x="22" y="155" fill="#6e987a">03</text><text x="60" y="155" fill="#c8d8c5">were first developed,</text>
        <text x="22" y="186" fill="#6e987a">04</text><text x="60" y="186" fill="#c8d8c5">the core idea was</text>
        <text x="22" y="217" fill="#6e987a">05</text><text x="60" y="217" fill="#93dbaa">denoising.</text>
        <text x="22" y="259" fill="#6e987a">06</text><text x="60" y="259" fill="#9de4b5">\begin{figure}</text>
        <text x="22" y="290" fill="#6e987a">07</text><text x="60" y="290" fill="#c8d8c5">\includegraphics{...}</text>
      </g>
